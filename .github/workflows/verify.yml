name: Verify public demo

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Guard public files and reachable history against private data
        run: python3 src/check_public_release.py --history
      - name: Rebuild the demo workbook from source
        run: |
          python3 src/make_demo_workbook.py --output /tmp/workbook.xlsx
          test -s /tmp/workbook.xlsx
      - name: Run the dependency-free public path
        run: |
          python3 src/run_excel_dashboard.py --output /tmp/excel-dashboard.html
          test -s /tmp/excel-dashboard.html
          test -s /tmp/executive-summary.pdf
          python3 src/make_demo_data.py
          SNAPSHOT=data/raw/orders-demo.json python3 src/transform.py
          SNAPSHOT=data/raw/orders-demo.json python3 src/checks.py
          SNAPSHOT=data/raw/orders-demo.json PANEL_OUT=/tmp/panel.html python3 src/publish.py
          test -s /tmp/panel.html
      - name: Prove the published dashboard is reproducible from the workbook
        run: |
          cmp /tmp/excel-dashboard.html docs/index.html
          cmp /tmp/executive-summary.pdf docs/executive-summary.pdf
      - name: Fail if the published demo still has unfilled placeholders
        run: |
          ! grep -q "{{" /tmp/excel-dashboard.html
      - name: Run calculation tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser scenario calculations
        run: node --test tests/test_*.js
